<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" data-profile-avatar src="https://via.placeholder.com/180x180" alt="Avatar do perfil">
            <h1 class="profile-name" data-profile-name>Carregando...</h1>
            <h2 class="profile-username" data-profile-username>@</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span data-profile-repos>0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span data-profile-followers>0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span data-profile-following>0</span>
                </li>
            </ul>
            <p class="profile-bio" data-profile-bio></p>
            <a href="#" class="profile-link" data-profile-link rel="noopener noreferrer" target="_blank">Ver no Github</a>
            <p class="status-message" data-status-message aria-live="polite"></p>
        </div>
    </header>
    <script src="app.js"></script>
</body>
</html>
