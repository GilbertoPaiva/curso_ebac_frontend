<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Produtos - Exercício LESS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="build/styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Minha Loja</h1>
            <nav>
                <ul class="menu">
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#produtos">Produtos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="produtos">
        <div class="container">
            <h2>Nossos Produtos</h2>
            <div class="products">
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+1" alt="Produto 1">
                    <a href="#" class="product-button">Comprar</a>
                </div>
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+2" alt="Produto 2">
                    <a href="#" class="product-button">Comprar</a>
                </div>
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+3" alt="Produto 3">
                    <a href="#" class="product-button">Comprar</a>
                </div>
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+4" alt="Produto 4">
                    <a href="#" class="product-button">Comprar</a>
                </div>
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+5" alt="Produto 5">
                    <a href="#" class="product-button">Comprar</a>
                </div>
                <div class="product-item">
                    <img src="https://via.placeholder.com/300x200/44bd32/ffffff?text=Produto+6" alt="Produto 6">
                    <a href="#" class="product-button">Comprar</a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
